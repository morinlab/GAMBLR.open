name: Release gamblr-collective container

# Maintainer-triggered only -- mirrors docker/release_container.sh's own
# "manual, explicit control" design (see docker/RELEASING.md). Building and
# pushing a multi-GB image on every merge/tag isn't what we want; this runs
# only when someone deliberately dispatches it (Actions tab -> this
# workflow -> "Run workflow", or `gh workflow run release_container.yaml`).
#
# Runs docker/release_container.sh unchanged -- so the exact same script
# works whether triggered from here or run locally, and the two paths
# can't drift apart.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (blank = this repo's DESCRIPTION Version)"
        required: false
        type: string
      gamblr_data_ref:
        description: "GAMBLR.data ref"
        required: false
        default: master
        type: string
      gamblr_helpers_ref:
        description: "GAMBLR.helpers ref"
        required: false
        default: master
        type: string
      gamblr_utils_ref:
        description: "GAMBLR.utils ref"
        required: false
        default: master
        type: string
      gamblr_viz_ref:
        description: "GAMBLR.viz ref"
        required: false
        default: master
        type: string
      gamblr_predict_ref:
        description: "GAMBLR.predict ref"
        required: false
        default: master
        type: string
      gamblr_open_ref:
        description: "GAMBLR.open ref"
        required: false
        default: master
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bioconductor-heavy solves (350+ packages once transitive deps are
      # counted) plus Docker's own build layers are a known way to exceed
      # standard runners' ~14GB free disk -- reclaim space preinstalled
      # software we don't need takes up before it becomes a problem.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          GAMBLR_DATA_REF: ${{ inputs.gamblr_data_ref }}
          GAMBLR_HELPERS_REF: ${{ inputs.gamblr_helpers_ref }}
          GAMBLR_UTILS_REF: ${{ inputs.gamblr_utils_ref }}
          GAMBLR_VIZ_REF: ${{ inputs.gamblr_viz_ref }}
          GAMBLR_PREDICT_REF: ${{ inputs.gamblr_predict_ref }}
          GAMBLR_OPEN_REF: ${{ inputs.gamblr_open_ref }}
        run: ./docker/release_container.sh "${{ inputs.tag }}"
